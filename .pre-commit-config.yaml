repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint
        language: system
        entry: ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format --check
        pass_filenames: false
        always_run: true
  - repo: git@gitlab.holi.team:app/holi-meta.git
    rev: 490c0695ab992fb9a2e2ca62dd1bd10690376a1f
    hooks:
      - id: scan-comments
      - id: security-checks
      - id: gitleaks
