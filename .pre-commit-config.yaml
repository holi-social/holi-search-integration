repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint
        language: system
        entry: ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format --check
        pass_filenames: false
        always_run: true